<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201a16" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Your guides and notes, beautifully readable and available offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cortado" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icons/cup.svg" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Cortado</title>
    <script>
      // Apply the saved reading theme before first paint (see src/state/prefs.ts).
      try {
        var t = (JSON.parse(localStorage.getItem('cortado.prefs') || '{}').theme) || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
